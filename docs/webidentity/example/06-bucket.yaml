apiVersion: obs.opentelekomcloud.m.crossplane.io/v1alpha1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: obs/v1alpha1/bucket
  labels:
    testing.upbound.io/example-name: obs-bucket-main
  name: obs-bkt-crossplane-1212
  namespace: test
spec:
  forProvider:
    bucket: obs-bkt-crossplane-1212
    tags:
      Env: Test
      foo: bar
  providerConfigRef:
    name: webidentity
    kind: ProviderConfig

---
apiVersion: obs.opentelekomcloud.m.crossplane.io/v1alpha1
kind: BucketObject
metadata:
  annotations:
    meta.upbound.io/example-id: obs/v1alpha1/bucketobject
  labels:
    testing.upbound.io/example-name: obs-object
  name: obs-bobj-1212
  namespace: test
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: obs-bucket-main
    content: |
      {"provider_name": "t_cloud_public"}
    contentType: application/json
    key: test_index_json
  providerConfigRef:
    name: webidentity
    kind: ProviderConfig
