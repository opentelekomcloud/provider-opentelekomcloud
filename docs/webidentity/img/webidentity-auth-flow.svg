<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24517a"/>
    </marker>
    <marker id="arrowwhite" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
    <marker id="dasharrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="70" y="85" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#16324a">WebIdentity Authentication Flow</text>
  <text x="70" y="128" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#52667a">Secretless, short-lived credential exchange &#183; BETA &#183; namespaced ProviderConfig only</text>

  <line x1="1690" y1="58" x2="1750" y2="58" stroke="#24517a" stroke-width="4"/>
  <text x="1762" y="66" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52667a">runtime flow</text>
  <line x1="1918" y1="58" x2="1978" y2="58" stroke="#a06a2c" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="1990" y="66" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#52667a">trust / authorization</text>
  <line x1="2164" y1="58" x2="2216" y2="58" stroke="#24517a" stroke-width="4" stroke-dasharray="9 6"/>
  <text x="2228" y="66" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#52667a">config reference</text>

  <rect x="60" y="170" width="900" height="1030" rx="24" fill="#eef5ff" stroke="#c3d8f2" stroke-width="2"/>
  <rect x="1000" y="170" width="1340" height="1030" rx="24" fill="#E20074" stroke="#b0005b" stroke-width="2"/>
  <text x="92" y="214" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#24517a">Kubernetes / CCE cluster</text>
  <text x="1032" y="214" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">T Cloud Public</text>

  <rect x="95" y="260" width="310" height="230" rx="16" fill="#ffffff" stroke="#3b6ea5" stroke-width="2.5"/>
  <text x="250" y="308" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f3b57">CCE API Server</text>
  <text x="250" y="342" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#24517a">OIDC Identity Provider</text>
  <text x="250" y="386" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#44515e">Issues short-lived signed JWT</text>
  <text x="250" y="416" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#44515e">Exposes issuer URL + JWKS</text>
  <rect x="115" y="438" width="270" height="36" rx="8" fill="#f4f8fd" stroke="#d3e1f2"/>
  <text x="250" y="463" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#33506b">CCE v1.19.16+ / external IdP</text>

  <rect x="555" y="260" width="350" height="340" rx="16" fill="#ffffff" stroke="#3b6ea5" stroke-width="2.5"/>
  <text x="730" y="308" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f3b57">Provider Pod</text>
  <text x="730" y="340" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#24517a">Crossplane package runtime</text>
  <rect x="575" y="362" width="310" height="38" rx="8" fill="#f7fbff" stroke="#cfdded"/>
  <text x="730" y="387" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#33506b">WebIdentity ProviderConfig</text>
  <rect x="575" y="412" width="310" height="38" rx="8" fill="#f7fbff" stroke="#cfdded"/>
  <text x="730" y="437" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#33506b">tokenConfig: Filesystem | Secret</text>
  <rect x="575" y="462" width="310" height="38" rx="8" fill="#f7fbff" stroke="#cfdded"/>
  <text x="730" y="487" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#33506b">configures Terraform OTC provider</text>
  <rect x="575" y="530" width="310" height="36" rx="8" fill="#fff8ee" stroke="#e6c79a"/>
  <text x="730" y="554" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9a5410">re-reads token every reconcile</text>

  <line x1="405" y1="385" x2="548" y2="385" stroke="#24517a" stroke-width="3.5" marker-end="url(#arrow)"/>
  <circle cx="480" cy="345" r="19" fill="#24517a"/>
  <text x="480" y="353" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">1</text>
  <text x="480" y="419" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#33506b">short-lived</text>
  <text x="480" y="443" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#33506b">service account</text>
  <text x="480" y="467" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#33506b">token (OIDC JWT)</text>

  <line x1="905" y1="385" x2="999" y2="385" stroke="#24517a" stroke-width="3.5"/>
  <line x1="999" y1="385" x2="1073" y2="385" stroke="#ffffff" stroke-width="3.5" marker-end="url(#arrowwhite)"/>
  <circle cx="989" cy="345" r="19" fill="#24517a"/>
  <text x="989" y="353" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">2</text>
  <rect x="909" y="404" width="160" height="54" rx="10" fill="#ffffff"/>
  <text x="989" y="425" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#33506b">ID token +</text>
  <text x="989" y="449" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#33506b">X-Idp-Id header</text>

  <line x1="1080" y1="480" x2="999" y2="480" stroke="#ffffff" stroke-width="3.5"/>
  <line x1="999" y1="480" x2="912" y2="480" stroke="#24517a" stroke-width="3.5" marker-end="url(#arrow)"/>
  <circle cx="989" cy="515" r="19" fill="#24517a"/>
  <text x="989" y="523" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">4</text>
  <rect x="908" y="540" width="162" height="76" rx="10" fill="#ffffff"/>
  <text x="989" y="560" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#33506b">project-scoped</text>
  <text x="989" y="584" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#33506b">OTC token</text>
  <text x="989" y="608" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#c96f1f">(+ temp AK/SK for OBS)</text>

  <rect x="1080" y="260" width="470" height="250" rx="16" fill="#ffffff" stroke="#d9822b" stroke-width="2.5"/>
  <text x="1315" y="308" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#8a4b0f">IAM token exchange</text>
  <text x="1315" y="348" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#44515e">POST /v3.0/OS-AUTH/id-token/tokens</text>
  <text x="1315" y="380" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#44515e">X-Idp-Id: &lt;idpID&gt;</text>
  <line x1="1120" y1="402" x2="1510" y2="402" stroke="#f0d9bd" stroke-width="2"/>
  <text x="1315" y="434" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#9a5410">optional: /v3.0/OS-CREDENTIAL/</text>
  <text x="1315" y="462" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#9a5410">securitytokens &#8594; temporary AK/SK</text>

  <line x1="1315" y1="510" x2="1315" y2="672" stroke="#ffffff" stroke-width="3.5" marker-end="url(#arrowwhite)"/>
  <circle cx="1268" cy="575" r="19" fill="#ffffff"/>
  <text x="1268" y="583" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E20074">3</text>
  <text x="1332" y="568" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">verify iss / aud / JWKS</text>
  <text x="1332" y="594" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">map sub &#8594; user + group</text>

  <rect x="1700" y="260" width="580" height="340" rx="16" fill="#ffffff" stroke="#d9822b" stroke-width="2.5"/>
  <text x="1990" y="308" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#8a4b0f">T Cloud Service APIs</text>
  <text x="1990" y="356" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#44515e">VPC &#183; RDS &#183; CCE &#183; DDS &#183; LTS &#183; OBS &#183; &#8230;</text>
  <text x="1990" y="406" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">Calls authorized by the mapped IAM</text>
  <text x="1990" y="432" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">group&#8217;s roles in scope.project</text>
  <rect x="1725" y="470" width="530" height="44" rx="8" fill="#fff6ea" stroke="#efcf9f"/>
  <text x="1990" y="498" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9a5410">OBS requires temporaryCredentials (temp AK/SK)</text>

  <path d="M 730 600 V 660 H 1000" fill="none" stroke="#24517a" stroke-width="3.5"/>
  <path d="M 1000 660 H 1740 V 612" fill="none" stroke="#ffffff" stroke-width="3.5" marker-end="url(#arrowwhite)"/>
  <circle cx="1230" cy="660" r="19" fill="#ffffff"/>
  <text x="1230" y="668" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E20074">5</text>
  <text x="1262" y="646" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">resource calls (authorized by group roles)</text>

  <rect x="1060" y="680" width="1240" height="440" rx="18" fill="#fffdf8" stroke="#e8c99c" stroke-width="2"/>
  <text x="1090" y="722" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#8a4b0f">IAM federation &#8212; trust anchors (configured once)</text>

  <rect x="1088" y="745" width="360" height="340" rx="12" fill="#ffffff" stroke="#e6c79a" stroke-width="2"/>
  <text x="1268" y="790" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#8a4b0f">Identity Provider</text>
  <text x="1268" y="835" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">idpID  (X-Idp-Id)</text>
  <text x="1268" y="875" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">issuer = provider_url</text>
  <text x="1268" y="915" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">signing key (JWKS)</text>
  <text x="1268" y="955" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">protocol: OIDC &#183; enabled</text>

  <rect x="1468" y="745" width="360" height="340" rx="12" fill="#ffffff" stroke="#e6c79a" stroke-width="2"/>
  <text x="1648" y="790" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#8a4b0f">Identity Mapping</text>
  <text x="1648" y="835" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">matches token sub</text>
  <text x="1648" y="875" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">&#8594; virtual IAM user</text>
  <text x="1648" y="915" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">&#8594; IAM group</text>
  <text x="1648" y="955" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">no pre-existing user</text>

  <rect x="1848" y="745" width="424" height="340" rx="12" fill="#ffffff" stroke="#e6c79a" stroke-width="2"/>
  <text x="2060" y="790" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#8a4b0f">IAM Group + Roles</text>
  <text x="2060" y="835" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">permission boundary</text>
  <text x="2060" y="875" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">least privilege</text>
  <text x="2060" y="915" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">pinned to scope.project</text>
  <text x="2060" y="955" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#44515e">roles authorize API calls</text>

  <line x1="2060" y1="745" x2="2060" y2="612" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#dasharrow)"/>
  <text x="2080" y="636" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff">roles authorize</text>
  <text x="2080" y="658" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff">API calls</text>

  <rect x="95" y="670" width="830" height="520" rx="16" fill="#ffffff" stroke="#3b6ea5" stroke-width="2.5"/>
  <text x="120" y="710" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f3b57">ProviderConfig (webidentity)</text>
  <line x1="120" y1="726" x2="900" y2="726" stroke="#dbe6f2" stroke-width="2"/>

  <text x="120" y="754" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">apiVersion: opentelekomcloud.m.crossplane.io/v1beta1</text>
  <text x="120" y="774" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">kind: ProviderConfig</text>
  <text x="120" y="794" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">metadata:</text>
  <text x="120" y="814" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">  name: webidentity</text>
  <text x="120" y="834" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">  namespace: test</text>
  <text x="120" y="854" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">spec:</text>
  <text x="120" y="874" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">  credentials:</text>
  <text x="120" y="894" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">    source: WebIdentity</text>
  <text x="120" y="914" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">    webIdentity:</text>
  <text x="120" y="934" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">      authURL: https://iam.eu-de.otc.t-systems.com<tspan fill="#7a8a99"> # IAM endpoint for your region</tspan></text>
  <text x="120" y="954" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">      idpID: crossplane-workload-identity<tspan fill="#7a8a99"> # the IAM provider name from Step 2.1</tspan></text>
  <text x="120" y="974" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">      region: eu-de</text>
  <text x="120" y="994" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">      scope:</text>
  <text x="120" y="1014" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">        project:</text>
  <text x="120" y="1034" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">          name: eu-de</text>
  <text x="120" y="1054" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">      tokenConfig:</text>
  <text x="120" y="1074" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">        source: Filesystem</text>
  <text x="120" y="1094" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">        fs:</text>
  <text x="120" y="1114" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">          path: /var/run/secrets/otc/tokens/oidc-token</text>
  <text x="120" y="1134" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">      temporaryCredentials:</text>
  <text x="120" y="1154" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">        enabled: true</text>
  <text x="120" y="1174" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f3b57">        durationSeconds: 3600</text>
</svg>
