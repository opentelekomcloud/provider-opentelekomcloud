---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: clusterproviderconfigs.opentelekomcloud.m.crossplane.io
spec:
  group: opentelekomcloud.m.crossplane.io
  names:
    categories:
    - crossplane
    - provider
    - opentelekomcloud
    kind: ClusterProviderConfig
    listKind: ClusterProviderConfigList
    plural: clusterproviderconfigs
    singular: clusterproviderconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    - jsonPath: .spec.credentials.secretRef.name
      name: SECRET-NAME
      priority: 1
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: A ClusterProviderConfig configures the OpenTelekomCloud provider.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A ProviderConfigSpec defines the desired state of a ProviderConfig.
            properties:
              credentials:
                description: Credentials required to authenticate to this provider.
                properties:
                  env:
                    description: |-
                      Env is a reference to an environment variable that contains credentials
                      that must be used to connect to the provider.
                    properties:
                      name:
                        description: Name is the name of an environment variable.
                        type: string
                    required:
                    - name
                    type: object
                  fs:
                    description: |-
                      Fs is a reference to a filesystem location that contains credentials that
                      must be used to connect to the provider.
                    properties:
                      path:
                        description: Path is a filesystem path.
                        type: string
                    required:
                    - path
                    type: object
                  secretRef:
                    description: |-
                      A SecretRef is a reference to a secret key that contains the credentials
                      that must be used to connect to the provider.
                    properties:
                      key:
                        description: The key to select.
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                      namespace:
                        description: Namespace of the secret.
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                  source:
                    description: Source of the provider credentials.
                    enum:
                    - None
                    - Secret
                    - InjectedIdentity
                    - Environment
                    - Filesystem
                    - WebIdentity
                    type: string
                  webIdentity:
                    description: |-
                      WebIdentity configures authenticating to the cloud using a workload
                      identity. It is only used when Source is WebIdentity.
                    properties:
                      authURL:
                        description: |-
                          AuthURL is the base URL of the T Cloud IAM identity service, e.g.
                          https://iam.eu-de.otc.t-systems.com.
                        type: string
                      idpID:
                        description: |-
                          IdpID is the ID of the federated identity provider (IdP) registered with
                          T Cloud IAM.
                        type: string
                      region:
                        description: Region is the T Cloud region to operate in, e.g.
                          eu-de.
                        type: string
                      scope:
                        description: |-
                          Scope limits the resulting OTC token to a project. Only a project scope
                          is supported: set Project with exactly one of Id and Name. A Domain scope
                          is not supported, and a missing scope (unscoped token) is rejected.
                        properties:
                          domain:
                            description: |-
                              Domain scope. Not supported — only a project scope is supported. Retained
                              in the schema so domain-scoped auth can be re-enabled later without a
                              schema change.
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                            type: object
                          project:
                            description: Project scope, either by Id or Name (exactly
                              one).
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                            type: object
                        type: object
                      temporaryCredentials:
                        description: |-
                          TemporaryCredentials configures exchanging the OTC token for short-lived
                          AK/SK credentials, required by services that sign requests with AK/SK
                          (e.g. OBS). When omitted, no temporary credentials are issued.
                        properties:
                          durationSeconds:
                            description: |-
                              DurationSeconds is the validity period of the temporary credentials in
                              seconds. It must be between 900 (15 minutes) and 86400 (24 hours).
                              Defaults to 3600.
                            maximum: 86400
                            minimum: 900
                            type: integer
                          enabled:
                            description: |-
                              Enabled controls whether temporary credentials are obtained. Defaults to
                              true when this object is present.
                            type: boolean
                        type: object
                      tokenConfig:
                        description: TokenConfig defines where the OIDC identity token
                          is read from.
                        properties:
                          fs:
                            description: |-
                              Fs is a reference to a filesystem path holding the OIDC identity token,
                              used when Source is Filesystem.
                            properties:
                              path:
                                description: Path is a filesystem path.
                                type: string
                            required:
                            - path
                            type: object
                          secretRef:
                            description: |-
                              SecretRef is a reference to a secret key holding the OIDC identity token,
                              used when Source is Secret.
                            properties:
                              key:
                                description: The key to select.
                                type: string
                              name:
                                description: Name of the secret.
                                type: string
                              namespace:
                                description: Namespace of the secret.
                                type: string
                            required:
                            - key
                            - name
                            - namespace
                            type: object
                          source:
                            description: Source of the OIDC identity token.
                            enum:
                            - Secret
                            - Filesystem
                            type: string
                        required:
                        - source
                        type: object
                    required:
                    - authURL
                    - idpID
                    - region
                    - tokenConfig
                    type: object
                    x-kubernetes-validations:
                    - message: 'only a project scope is supported: set scope.project
                        (id or name); a domain scope is not supported'
                      rule: has(self.scope) && has(self.scope.project) && !has(self.scope.domain)
                required:
                - source
                type: object
            required:
            - credentials
            type: object
          status:
            description: A ProviderConfigStatus reflects the observed state of a ProviderConfig.
            properties:
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              users:
                description: Users of this provider configuration.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
