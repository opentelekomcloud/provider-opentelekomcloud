apiVersion: lts.opentelekomcloud.m.crossplane.io/v1alpha1
kind: KeywordsAlarmRuleV2
metadata:
  annotations:
    meta.upbound.io/example-id: lts/v1alpha1/keywordsalarmrulev2
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: upbound-system
spec:
  forProvider:
    description: created by terraform
    frequency:
    - type: HOURLY
    keywordsRequests:
    - condition: '>'
      keyword: key_words
      logGroupSelector:
        matchLabels:
          testing.upbound.io/example-name: example
      logStreamSelector:
        matchLabels:
          testing.upbound.io/example-name: example
      number: 100
      searchTimeRange: 5
      searchTimeRangeUnit: minute
    name: name
    notificationFrequency: 5
    notificationRule:
    - language: en-us
      timezone: xx/xx
      topics:
      - name: ${var.topic_name}
        topicUrnSelector:
          matchLabels:
            testing.upbound.io/example-name: example
      userName: test
    severity: CRITICAL
