apiVersion: lts.opentelekomcloud.m.crossplane.io/v1alpha1
kind: TransferV2
metadata:
  annotations:
    meta.upbound.io/example-id: lts/v1alpha1/transferv2
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: upbound-system
spec:
  forProvider:
    logGroupSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    logStreams:
    - logStreamSelector:
        matchLabels:
          testing.upbound.io/example-name: example
    logTransferInfo:
    - logStorageFormat: RAW
      logTransferDetail:
      - obsBucketSelector:
          matchLabels:
            testing.upbound.io/example-name: example
        obsDirPrefixName: dir_prefix_
        obsPeriod: 3
        obsPeriodUnit: hour
        obsPrefixName: prefix_
        obsTimeZone: UTC
        obsTimeZoneId: Etc/GMT
      logTransferMode: cycle
      logTransferStatus: ENABLE
      logTransferType: OBS
