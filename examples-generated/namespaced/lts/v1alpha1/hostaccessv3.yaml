apiVersion: lts.opentelekomcloud.m.crossplane.io/v1alpha1
kind: HostAccessV3
metadata:
  annotations:
    meta.upbound.io/example-id: lts/v1alpha1/hostaccessv3
  labels:
    testing.upbound.io/example-name: acc
  name: acc
  namespace: upbound-system
spec:
  forProvider:
    accessConfig:
    - blackPaths:
      - /var/log/*/a.log
      paths:
      - /var/log/*
      singleLogFormat:
      - mode: system
    hostGroupRef:
    - name: example
    logGroupSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    logStreamSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    name: access-demo
