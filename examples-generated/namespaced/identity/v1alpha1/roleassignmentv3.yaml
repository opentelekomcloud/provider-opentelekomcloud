apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: RoleAssignmentV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/roleassignmentv3
  labels:
    testing.upbound.io/example-name: role_assignment_1
  name: role-assignment-1
  namespace: upbound-system
spec:
  forProvider:
    groupSelector:
      matchLabels:
        testing.upbound.io/example-name: group_1
    projectSelector:
      matchLabels:
        testing.upbound.io/example-name: project_1
    roleSelector:
      matchLabels:
        testing.upbound.io/example-name: opentelekomcloud_identity_role_v3

---

apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: GroupV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/roleassignmentv3
  labels:
    testing.upbound.io/example-name: group_1
  name: group-1
  namespace: upbound-system
spec:
  forProvider:
    name: group_1

---

apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: ProjectV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/roleassignmentv3
  labels:
    testing.upbound.io/example-name: project_1
  name: project-1
  namespace: upbound-system
spec:
  forProvider:
    name: eu-de_project_1
