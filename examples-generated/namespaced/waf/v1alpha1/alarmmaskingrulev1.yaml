    meta.upbound.io/example-id: waf/v1alpha1/alarmmaskingrulev1
  labels:
    testing.upbound.io/example-name: rule_1
  name: rule-1
  namespace: upbound-system
spec:
  forProvider:
    conditions:
    - category: url
      contents:
      - /login
      logicOperation: equal
    description: description
    domainRef:
    - name: example
    policySelector:
      matchLabels:
        testing.upbound.io/example-name: policy_1
    rule: xss

