apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: CcRuleV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/ccrulev1
  labels:
    testing.upbound.io/example-name: rule_1
  name: rule-1
  namespace: upbound-system
spec:
  forProvider:
    action:
    - category: block
      content: '{"error":"forbidden"}'
      contentType: application/json
    limitNum: 10
    limitPeriod: 60
    lockTime: 10
    mode: 0
    policySelector:
      matchLabels:
        testing.upbound.io/example-name: policy_1
    tagIndex: sessionid
    tagType: cookie
    url: /abc1

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: PolicyV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/ccrulev1
  labels:
    testing.upbound.io/example-name: policy_1
  name: policy-1
  namespace: upbound-system
spec:
  forProvider:
    name: policy_cc
