apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: AntiCrawlerRuleV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/anticrawlerrulev1
  labels:
    testing.upbound.io/example-name: rule_1
  name: rule-1
  namespace: upbound-system
spec:
  forProvider:
    logic: 3
    name: anticrawler_1
    policySelector:
      matchLabels:
        testing.upbound.io/example-name: policy_1
    protectionMode: anticrawler_except_url
    url: /patent/id

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: PolicyV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/anticrawlerrulev1
  labels:
    testing.upbound.io/example-name: policy_1
  name: policy-1
  namespace: upbound-system
spec:
  forProvider:
    name: policy_cc
