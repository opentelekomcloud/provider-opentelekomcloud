apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: RouteTableRouteV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routetableroutev1
  labels:
    testing.upbound.io/example-name: route
  name: route
  namespace: upbound-system
spec:
  forProvider:
    description: peering route
    destination: 172.16.0.0/16
    nexthop: ${opentelekomcloud_vpc_peering_connection_v2.peering.id}
    type: peering
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: vpc_1

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: PeeringConnectionV2
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routetableroutev1
  labels:
    testing.upbound.io/example-name: peering
  name: peering
  namespace: upbound-system
spec:
  forProvider:
    name: my_peering
    peerVpcSelector:
      matchLabels:
        testing.upbound.io/example-name: vpc_2
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: vpc_1

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routetableroutev1
  labels:
    testing.upbound.io/example-name: vpc_1
  name: vpc-1
  namespace: upbound-system
spec:
  forProvider:
    cidr: 192.168.0.0/16
    name: vpc-1

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routetableroutev1
  labels:
    testing.upbound.io/example-name: vpc_2
  name: vpc-2
  namespace: upbound-system
spec:
  forProvider:
    cidr: 172.16.0.0/16
    name: vpc-2
