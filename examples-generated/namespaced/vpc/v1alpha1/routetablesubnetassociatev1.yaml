apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: RouteTableSubnetAssociateV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routetablesubnetassociatev1
  labels:
    testing.upbound.io/example-name: assoc
  name: assoc
  namespace: upbound-system
spec:
  forProvider:
    routeTableSelector:
      matchLabels:
        testing.upbound.io/example-name: table
    subnetSelector:
      matchLabels:
        testing.upbound.io/example-name: subnet

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: RouteTableV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routetablesubnetassociatev1
  labels:
    testing.upbound.io/example-name: table
  name: table
  namespace: upbound-system
spec:
  forProvider:
    name: my-table
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: vpc

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SubnetV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routetablesubnetassociatev1
  labels:
    testing.upbound.io/example-name: subnet
  name: subnet
  namespace: upbound-system
spec:
  forProvider:
    cidr: 192.168.0.0/24
    gatewayIp: 192.168.0.1
    name: my-subnet
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: vpc

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routetablesubnetassociatev1
  labels:
    testing.upbound.io/example-name: vpc
  name: vpc
  namespace: upbound-system
spec:
  forProvider:
    cidr: 192.168.0.0/16
    name: my-vpc
