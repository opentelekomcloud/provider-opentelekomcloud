apiVersion: dms.opentelekomcloud.m.crossplane.io/v1alpha1
kind: UserPermissionV1
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/userpermissionv1
  labels:
    testing.upbound.io/example-name: perm_1
  name: perm-1
  namespace: upbound-system
spec:
  forProvider:
    instanceSelector:
      matchLabels:
        testing.upbound.io/example-name: instance_1
    policies:
    - accessPolicy: all
      userSelector:
        matchLabels:
          testing.upbound.io/example-name: user_1
    - accessPolicy: sub
      userSelector:
        matchLabels:
          testing.upbound.io/example-name: user_2
    topicSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: dms.opentelekomcloud.m.crossplane.io/v1alpha1
kind: UserV2
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/userpermissionv1
  labels:
    testing.upbound.io/example-name: user_1
  name: user-1
  namespace: upbound-system
spec:
  forProvider:
    instanceSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    passwordSecretRef:
      key: example-key
      name: example-secret
    username: Test-user

---

apiVersion: dms.opentelekomcloud.m.crossplane.io/v1alpha1
kind: UserV2
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/userpermissionv1
  labels:
    testing.upbound.io/example-name: user_2
  name: user-2
  namespace: upbound-system
spec:
  forProvider:
    instanceSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    passwordSecretRef:
      key: example-key
      name: example-secret
    username: Test-user2
