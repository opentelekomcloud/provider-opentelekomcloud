apiVersion: dms.opentelekomcloud.crossplane.io/v1alpha1
kind: UserPermissionV1
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/userpermissionv1
  labels:
    testing.upbound.io/example-name: perm_1
  name: perm-1
spec:
  forProvider:
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: instance_1
    policies:
    - accessPolicy: all
      usernameSelector:
        matchLabels:
          testing.upbound.io/example-name: user_1
    - accessPolicy: sub
      usernameSelector:
        matchLabels:
          testing.upbound.io/example-name: user_2
    topicNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: dms.opentelekomcloud.crossplane.io/v1alpha1
kind: UserV2
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/userpermissionv1
  labels:
    testing.upbound.io/example-name: user_1
  name: user-1
spec:
  forProvider:
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    passwordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    username: Test-user

---

apiVersion: dms.opentelekomcloud.crossplane.io/v1alpha1
kind: UserV2
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/userpermissionv1
  labels:
    testing.upbound.io/example-name: user_2
  name: user-2
spec:
  forProvider:
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    passwordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    username: Test-user2
