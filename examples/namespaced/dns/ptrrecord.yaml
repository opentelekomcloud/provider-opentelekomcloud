apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: EIPV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/eipv1
  labels:
    testing.upbound.io/example-name: dns-ptr-eip
  name: dns-eip-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    bandwidth:
      - chargeMode: traffic
        name: dns-eip-${Rand.RFC1123Subdomain}
        shareType: PER
        size: 8
    publicip:
      - type: 5_bgp

---
apiVersion: dns.opentelekomcloud.m.crossplane.io/v1alpha1
kind: PtrrecordV2
metadata:
  annotations:
    meta.upbound.io/example-id: dns/v1alpha1/ptrrecordv2
  labels:
    testing.upbound.io/example-name: dns-ptr-record
  name: dns-pr-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    description: Crossplane example PTR record
    floatingIpSelector:
      matchLabels:
        testing.upbound.io/example-name: dns-ptr-eip
    name: ptr.crossplane.com.
    tags:
      foo: bar
    ttl: 2500