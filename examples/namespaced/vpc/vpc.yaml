apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SecondaryCidrV3
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/secondarycidrv3
  labels:
    testing.upbound.io/example-name: secondary
  name: vpc-sc-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidrs:
      - 23.9.0.0/16
      - 23.10.0.0/16
      - 23.11.0.0/16
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: vpc

---
apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/secondarycidrv3
  labels:
    testing.upbound.io/example-name: vpc
  name: vpc-vpc-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: 192.168.0.0/16
    name: vpc-vpc-${Rand.RFC1123Subdomain}