apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: RouteTableSubnetAssociateV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routetablesubnetassociatev1
  labels:
    testing.upbound.io/example-name: vpc-route-table-subnet-assoc
  name: vpc-rtb-subnet-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    routeTableSelector:
      matchLabels:
        testing.upbound.io/example-name: vpc-route-table-subnet-assoc-table
    subnetSelector:
      matchLabels:
        testing.upbound.io/example-name: vpc-route-table-subnet-assoc-subnet

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: RouteTableV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routetablesubnetassociatev1
  labels:
    testing.upbound.io/example-name: vpc-route-table-subnet-assoc-table
  name: vpc-rtb-subnet-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    name: vpc-rtb-subnet-${Rand.RFC1123Subdomain}
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: vpc-route-table-subnet-assoc-vpc

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SubnetV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routetablesubnetassociatev1
  labels:
    testing.upbound.io/example-name: vpc-route-table-subnet-assoc-subnet
  name: vpc-rtb-subnet-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: 192.168.0.0/24
    gatewayIp: 192.168.0.1
    name: vpc-rtb-subnet-${Rand.RFC1123Subdomain}
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: vpc-route-table-subnet-assoc-vpc

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/routetablesubnetassociatev1
  labels:
    testing.upbound.io/example-name: vpc-route-table-subnet-assoc-vpc
  name: vpc-rtb-subnet-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: 192.168.0.0/16
    name: vpc-rtb-subnet-${Rand.RFC1123Subdomain}
