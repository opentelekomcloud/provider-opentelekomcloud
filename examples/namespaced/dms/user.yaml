apiVersion: v1
kind: Secret
metadata:
  name: example-dms-user-password
  namespace: test
type: Opaque
data:
  example-dms-user-key: ${data.dmsKey}

---
apiVersion: dms.opentelekomcloud.m.crossplane.io/v1alpha1
kind: UserV2
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/userv2
  labels:
    testing.upbound.io/example-name: dms-user
  name: dms-user-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    username: crossplane-user
    passwordSecretRef:
      key: example-dms-user-key
      name: example-dms-user-password
    instanceSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-instance
