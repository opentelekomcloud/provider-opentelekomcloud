apiVersion: v1
kind: Secret
metadata:
  name: example-dms-password
  namespace: test
type: Opaque
data:
  example-dms-key: ${data.dmsKey}

---
apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/v1
  labels:
    testing.upbound.io/example-name: dms-vpc
  name: dms-vpc-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: "192.168.0.0/16"
    name: dms-vpc-${Rand.RFC1123Subdomain}
    tags:
      managed-by: crossplane

---
apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SubnetV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/subnetv1
  labels:
    testing.upbound.io/example-name: dms-subnet
  name: dms-stn-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: "192.168.0.0/16"
    gatewayIp: "192.168.0.1"
    name: dms-stn-${Rand.RFC1123Subdomain}
    ntpAddresses: "10.100.0.33,10.100.0.34"
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-vpc
    tags:
      managed-by: crossplane

---
apiVersion: compute.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SecgroupV2
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1alpha1/secgroupv2
  labels:
    testing.upbound.io/example-name: dms-sg
  name: dms-sg-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    description: crossplane DMS security group
    name: dms-sg-${Rand.RFC1123Subdomain}
    rule:
      - cidr: 192.168.0.0/16
        fromPort: 9092
        ipProtocol: tcp
        toPort: 9095

---
apiVersion: dms.opentelekomcloud.m.crossplane.io/v1alpha1
kind: DedicatedInstanceV2
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/dedicatedinstancev2
  labels:
    testing.upbound.io/example-name: dms-instance
  name: dms-kafka-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    name: dms-kafka-${Rand.RFC1123Subdomain}
    # DMS AZ ID (eu-de-01), see GET /v2/available-zones.
    availableZones:
      - bf84aba586ce4e948da0b97d9a7d62fb
    flavorId: s6.2u4g.single.small
    storageSpecCode: dms.physical.storage.ultra.v2
    engineVersion: "2.7"
    storageSpace: 300
    brokerNum: 1
    retentionPolicy: time_base
    # SASL is required by UserV2 and UserPermissionV1.
    sslEnable: true
    securityProtocol: SASL_PLAINTEXT
    enabledMechanisms:
      - SCRAM-SHA-512
    accessUser: crossplane
    passwordSecretRef:
      key: example-dms-key
      name: example-dms-password
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-vpc
    subnetSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-subnet
    computeSecurityGroupSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-sg
    tags:
      managed-by: crossplane

---
apiVersion: dms.opentelekomcloud.m.crossplane.io/v1alpha1
kind: TopicV2
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/topicv2
  labels:
    testing.upbound.io/example-name: dms-topic
  name: dms-topic-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    name: crossplane-topic
    partition: 3
    # Single-broker instance: the replication factor cannot exceed the broker count.
    replication: 1
    retentionTime: 72
    instanceSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-instance

---
apiVersion: v1
kind: Secret
metadata:
  name: example-dms-user-password
  namespace: test
type: Opaque
data:
  example-dms-user-key: ${data.dmsKey}

---
apiVersion: dms.opentelekomcloud.m.crossplane.io/v1alpha1
kind: UserV2
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/userv2
  labels:
    testing.upbound.io/example-name: dms-user
  name: dms-user-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    username: crossplane-user
    passwordSecretRef:
      key: example-dms-user-key
      name: example-dms-user-password
    instanceSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-instance

---
apiVersion: dms.opentelekomcloud.m.crossplane.io/v1alpha1
kind: UserPermissionV1
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/userpermissionv1
  labels:
    testing.upbound.io/example-name: dms-user-permission
  name: dms-user-permission-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    instanceSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-instance
    topicSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-topic
    policies:
      - accessPolicy: all
        userSelector:
          matchLabels:
            testing.upbound.io/example-name: dms-user

---
apiVersion: dms.opentelekomcloud.m.crossplane.io/v1alpha1
kind: ConsumerGroupV2
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/consumergroupv2
  labels:
    testing.upbound.io/example-name: dms-consumer-group
  name: dms-consumer-group-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    groupName: crossplane-consumer-group
    description: Consumer group managed by Crossplane
    instanceSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-instance
