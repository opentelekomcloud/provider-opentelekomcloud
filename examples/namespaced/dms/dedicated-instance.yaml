apiVersion: v1
kind: Secret
metadata:
  name: example-dms-password
  namespace: test
type: Opaque
data:
  example-dms-key: ${data.dmsKey}

---
apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/v1
  labels:
    testing.upbound.io/example-name: dms-vpc
  name: dms-vpc-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: "192.168.0.0/16"
    name: dms-vpc-${Rand.RFC1123Subdomain}
    tags:
      managed-by: crossplane

---
apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SubnetV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/subnetv1
  labels:
    testing.upbound.io/example-name: dms-subnet
  name: dms-stn-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: "192.168.0.0/16"
    gatewayIp: "192.168.0.1"
    name: dms-stn-${Rand.RFC1123Subdomain}
    ntpAddresses: "10.100.0.33,10.100.0.34"
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-vpc
    tags:
      managed-by: crossplane

---
apiVersion: compute.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SecgroupV2
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1alpha1/secgroupv2
  labels:
    testing.upbound.io/example-name: dms-sg
  name: dms-sg-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    description: crossplane DMS security group
    name: dms-sg-${Rand.RFC1123Subdomain}
    rule:
      - cidr: 192.168.0.0/16
        fromPort: 9092
        ipProtocol: tcp
        toPort: 9095

---
apiVersion: dms.opentelekomcloud.m.crossplane.io/v1alpha1
kind: DedicatedInstanceV2
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/dedicatedinstancev2
  labels:
    testing.upbound.io/example-name: dms-instance
  name: dms-kafka-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    name: dms-kafka-${Rand.RFC1123Subdomain}
    availableZones:
      - eu-de-01
    flavorId: s6.2u4g.single.small
    storageSpecCode: dms.physical.storage.ultra.v2
    engineVersion: "2.7"
    storageSpace: 300
    brokerNum: 1
    retentionPolicy: time_base
    # SASL is required by UserV2 and UserPermissionV1.
    sslEnable: true
    securityProtocol: SASL_PLAINTEXT
    enabledMechanisms:
      - SCRAM-SHA-512
    accessUser: crossplane
    passwordSecretRef:
      key: example-dms-key
      name: example-dms-password
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-vpc
    subnetSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-subnet
    computeSecurityGroupSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-sg
    tags:
      managed-by: crossplane
