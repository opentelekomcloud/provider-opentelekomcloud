apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/vpcv1
  labels:
    testing.upbound.io/example-name: wafd-vpc
  name: wafd-vpc-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: 192.168.0.0/16
    name: wafd-vpc-${Rand.RFC1123Subdomain}

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SubnetV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/subnetv1
  labels:
    testing.upbound.io/example-name: wafd-subnet
  name: wafd-subnet-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: 192.168.0.0/24
    gatewayIp: 192.168.0.1
    name: wafd-subnet-${Rand.RFC1123Subdomain}
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-vpc

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SecgroupV3
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/secgroupv3
  labels:
    testing.upbound.io/example-name: wafd-secgroup
  name: wafd-secgroup-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    description: dedicated WAF security group
    name: wafd-secgroup-${Rand.RFC1123Subdomain}

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: InstanceV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/instancev1
  labels:
    testing.upbound.io/example-name: wafd-instance
  name: wafd-instance-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    architecture: x86
    availabilityZone: eu-de-01
    flavor: s2.large.2
    name: wafd-instance-${Rand.RFC1123Subdomain}
    securityGroupSelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-secgroup
    specification: waf.instance.professional
    subnetSelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-subnet
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-vpc
