apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: PolicyV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/policyv1
  labels:
    testing.upbound.io/example-name: wafd-antileakage-policy
  name: wafd-antileakage-policy-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    name: wafd-antileakage-policy-${Rand.RFC1123Subdomain}

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: AntiLeakageRuleV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/antileakagerulev1
  labels:
    testing.upbound.io/example-name: wafd-antileakage-rule
  name: wafd-antileakage-rule-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    action: block
    category: sensitive
    contents:
      - id_card
    description: block responses leaking identity card numbers
    policySelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-antileakage-policy
    url: /attack
