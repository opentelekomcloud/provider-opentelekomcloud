apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/vpcv1
  labels:
    testing.upbound.io/example-name: wafd-domain-vpc
  name: wafd-domain-vpc-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: 192.168.0.0/16
    name: wafd-domain-vpc-${Rand.RFC1123Subdomain}

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SubnetV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/subnetv1
  labels:
    testing.upbound.io/example-name: wafd-domain-subnet
  name: wafd-domain-subnet-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: 192.168.0.0/24
    gatewayIp: 192.168.0.1
    name: wafd-domain-subnet-${Rand.RFC1123Subdomain}
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-domain-vpc

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: PolicyV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/policyv1
  labels:
    testing.upbound.io/example-name: wafd-domain-policy
  name: wafd-domain-policy-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    name: wafd-domain-policy-${Rand.RFC1123Subdomain}
    protectionMode: block

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: DomainV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/domainv1
  labels:
    testing.upbound.io/example-name: wafd-domain
  name: wafd-domain-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    domain: www.wafd-${Rand.RFC1123Subdomain}.example.com
    keepPolicy: true
    policySelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-domain-policy
    proxy: true
    server:
      - address: 192.168.0.10
        clientProtocol: HTTP
        port: 8080
        serverProtocol: HTTP
        type: ipv4
        vpcSelector:
          matchLabels:
            testing.upbound.io/example-name: wafd-domain-vpc
    timeoutConfig:
      - connectTimeout: 20
        readTimeout: 60
        sendTimeout: 60
