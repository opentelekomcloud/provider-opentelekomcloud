apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/vpcv1
  labels:
    testing.upbound.io/example-name: wafd-precise-vpc
  name: wafd-precise-vpc-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: 192.168.0.0/16
    name: wafd-precise-vpc-${Rand.RFC1123Subdomain}

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SubnetV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/subnetv1
  labels:
    testing.upbound.io/example-name: wafd-precise-subnet
  name: wafd-precise-subnet-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: 192.168.0.0/24
    gatewayIp: 192.168.0.1
    name: wafd-precise-subnet-${Rand.RFC1123Subdomain}
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-precise-vpc

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: PolicyV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/policyv1
  labels:
    testing.upbound.io/example-name: wafd-precise-policy
  name: wafd-precise-policy-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    name: wafd-precise-policy-${Rand.RFC1123Subdomain}

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: DomainV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/domainv1
  labels:
    testing.upbound.io/example-name: wafd-precise-domain
  name: wafd-precise-domain-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    domain: www.wafd-precise-${Rand.RFC1123Subdomain}.example.com
    keepPolicy: true
    policySelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-precise-policy
    proxy: true
    server:
      - address: 192.168.0.10
        clientProtocol: HTTP
        port: 8080
        serverProtocol: HTTP
        type: ipv4
        vpcSelector:
          matchLabels:
            testing.upbound.io/example-name: wafd-precise-vpc

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: ReferenceTableV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/referencetablev1
  labels:
    testing.upbound.io/example-name: wafd-precise-reference-table
  name: wafd-precise-reference-table-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    conditions:
      - /admin
    name: wafd-precise-reference-table-${Rand.RFC1123Subdomain}
    type: url

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: KnownAttackSourceRuleV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/knownattacksourcerulev1
  labels:
    testing.upbound.io/example-name: wafd-precise-source-rule
  name: wafd-precise-source-rule-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    blockTime: 301
    category: long_ip_block
    description: block long-lived IP attack sources
    policySelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-precise-policy

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: PreciseProtectionRuleV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/preciseprotectionrulev1
  labels:
    testing.upbound.io/example-name: wafd-precise-rule
  name: wafd-precise-rule-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    action:
      - category: block
        knownAttackSourceSelector:
          matchLabels:
            testing.upbound.io/example-name: wafd-precise-source-rule
    conditions:
      - category: url
        logicOperation: contain_any
        referenceTableSelector:
          matchLabels:
            testing.upbound.io/example-name: wafd-precise-reference-table
    description: block requests matching the reference table
    policySelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-precise-policy
    priority: 50
    time: false
