apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/vpcv1
  labels:
    testing.upbound.io/example-name: wafd-masking-vpc
  name: wafd-masking-vpc-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: 192.168.0.0/16
    name: wafd-masking-vpc-${Rand.RFC1123Subdomain}

---

apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SubnetV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/subnetv1
  labels:
    testing.upbound.io/example-name: wafd-masking-subnet
  name: wafd-masking-subnet-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: 192.168.0.0/24
    gatewayIp: 192.168.0.1
    name: wafd-masking-subnet-${Rand.RFC1123Subdomain}
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-masking-vpc

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: PolicyV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/policyv1
  labels:
    testing.upbound.io/example-name: wafd-masking-policy
  name: wafd-masking-policy-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    name: wafd-masking-policy-${Rand.RFC1123Subdomain}

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: DomainV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/domainv1
  labels:
    testing.upbound.io/example-name: wafd-masking-domain
  name: wafd-masking-domain-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    domain: www.wafd-masking-${Rand.RFC1123Subdomain}.example.com
    keepPolicy: true
    policySelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-masking-policy
    proxy: true
    server:
      - address: 192.168.0.10
        clientProtocol: HTTP
        port: 8080
        serverProtocol: HTTP
        type: ipv4
        vpcSelector:
          matchLabels:
            testing.upbound.io/example-name: wafd-masking-vpc

---

apiVersion: waf.opentelekomcloud.m.crossplane.io/v1alpha1
kind: AlarmMaskingRuleV1
metadata:
  annotations:
    meta.upbound.io/example-id: waf/v1alpha1/alarmmaskingrulev1
  labels:
    testing.upbound.io/example-name: wafd-masking-rule
  name: wafd-masking-rule-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    advancedSettings:
      - contents:
          - content-type
        index: header
    conditions:
      - category: url
        contents:
          - /login
        logicOperation: equal
    description: mask XSS alarms for the login page
    domainSelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-masking-domain
    policySelector:
      matchLabels:
        testing.upbound.io/example-name: wafd-masking-policy
    rule: xss
