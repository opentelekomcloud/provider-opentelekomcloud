apiVersion: obs.opentelekomcloud.m.crossplane.io/v1alpha1
kind: BucketPolicy
metadata:
  name: obs-bpol-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: obs-bucketpolicy-static-bucket
    policy: |
      {
        "Statement": [{
          "Effect": "Allow",
          "Principal": {"ID": ["*"]},
          "Action": ["GetObject", "PutObject"],
          "Resource": ["xp-bucket-statictest-0428/*"]
        }]
      }

---
apiVersion: obs.opentelekomcloud.m.crossplane.io/v1alpha1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: obs/v1alpha1/bucket
  labels:
    testing.upbound.io/example-name: obs-bucketpolicy-static-bucket
  name: xp-bucket-policy-static-bucket
  namespace: test
spec:
  forProvider:
    bucket: xp-bucket-statictest-0428
    tags:
      Env: Test
      foo: bar
