apiVersion: obs.opentelekomcloud.m.crossplane.io/v1alpha1
kind: BucketObjectACL
metadata:
  annotations:
    meta.upbound.io/example-id: obs/v1alpha1/bucketacl
  labels:
    testing.upbound.io/example-name: test
  name: obs-oacl-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: b
    keySelector:
      matchLabels:
        testing.upbound.io/example-name: object
    publicPermission:
      - accessToAcl:
          - READ_ACP
        accessToObject:
          - READ