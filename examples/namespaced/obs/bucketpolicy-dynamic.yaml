apiVersion: obs.opentelekomcloud.m.crossplane.io/v1alpha1
kind: BucketPolicy
metadata:
  name: obs-pol-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: b
    policy: |
      {
        "Statement": [{
          "Effect": "Allow",
          "Principal": {"ID": ["*"]},
          "Action": ["GetObject", "PutObject"],
          "Resource": ["${this.bucket}/*"]
        }]
      }