apiVersion: obs.opentelekomcloud.m.crossplane.io/v1alpha1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: obs/v1alpha1/bucket
  labels:
    testing.upbound.io/example-name: b
  name: b
  namespace: test
spec:
  forProvider:
    bucket: xp-test-55551215
    tags:
      Env: Test
      foo: bar
    logging:
      - targetBucketSelector:
          matchLabels:
            testing.upbound.io/example-name: logging
---
apiVersion: obs.opentelekomcloud.m.crossplane.io/v1alpha1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: obs/v1alpha1/bucket
  labels:
    testing.upbound.io/example-name: logging
  name: logging
  namespace: test
spec:
  forProvider:
    bucket: xp-test-55555-log
    forceDestroy: true
    tags:
      Env: Test
      foo: bar

---
apiVersion: obs.opentelekomcloud.m.crossplane.io/v1alpha1
kind: BucketACL
metadata:
  annotations:
    meta.upbound.io/example-id: obs/v1alpha1/bucketacl
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: test
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: logging
    logDeliveryUserPermission:
      - accessToAcl:
          - READ_ACP
          - WRITE_ACP
        accessToBucket:
          - READ
          - WRITE
    ownerPermission:
      - accessToAcl:
          - READ_ACP
          - WRITE_ACP
        accessToBucket:
          - READ
          - WRITE
