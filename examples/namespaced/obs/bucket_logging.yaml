apiVersion: obs.opentelekomcloud.m.crossplane.io/v1alpha1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: obs/v1alpha1/bucket
  labels:
    testing.upbound.io/example-name: obs-log-bucket
  name: obs-bkt-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    bucket: obs-bkt-${Rand.RFC1123Subdomain}
    tags:
      Env: Test
      foo: bar
    logging:
      - targetBucketSelector:
          matchLabels:
            testing.upbound.io/example-name: obs-log-target
---
apiVersion: obs.opentelekomcloud.m.crossplane.io/v1alpha1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: obs/v1alpha1/bucket
  labels:
    testing.upbound.io/example-name: obs-log-target
  name: obs-bkl-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    bucket: obs-bkl-${Rand.RFC1123Subdomain}
    forceDestroy: true
    tags:
      Env: Test
      foo: bar

---
apiVersion: obs.opentelekomcloud.m.crossplane.io/v1alpha1
kind: BucketACL
metadata:
  annotations:
    meta.upbound.io/example-id: obs/v1alpha1/bucketacl
  labels:
    testing.upbound.io/example-name: obs-log-acl
  name: obs-bacl-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: obs-log-target
    logDeliveryUserPermission:
      - accessToAcl:
          - READ_ACP
        accessToBucket:
          - READ
          - WRITE
    ownerPermission:
      - accessToAcl:
          - READ_ACP
          - WRITE_ACP
        accessToBucket:
          - READ
          - WRITE
