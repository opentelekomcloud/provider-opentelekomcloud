apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/v1
  labels:
    testing.upbound.io/example-name: nat-vpc
  name: nat-vpc-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: "192.168.0.0/16"
    name: nat-vpc-${Rand.RFC1123Subdomain}
    tags:
      managed-by: crossplane
---
apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SubnetV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/subnetv1
  labels:
    testing.upbound.io/example-name: nat-subnet
  name: nat-stn-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: "192.168.0.0/16"
    gatewayIp: "192.168.0.1"
    name: nat-stn-${Rand.RFC1123Subdomain}
    ntpAddresses: "10.100.0.33,10.100.0.34"
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: nat-vpc
    tags:
      managed-by: crossplane

---
apiVersion: nat.opentelekomcloud.m.crossplane.io/v1alpha1
kind: GatewayV2
metadata:
  annotations:
    meta.upbound.io/example-id: nat/v1alpha1/gatewayv2
  labels:
    testing.upbound.io/example-name: nat-gateway
  name: nat-gw-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    description: NAT GW created by crossplane
    internalNetworkSelector:
      matchLabels:
        testing.upbound.io/example-name: nat-subnet
    name: nat-gw-${Rand.RFC1123Subdomain}
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: nat-vpc
    spec: "1"
    tags:
      managed-by: crossplane

---
apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: EIPV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/eipv1
  labels:
    testing.upbound.io/example-name: nat-eip-1
  name: nat-eip-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    bandwidth:
      - chargeMode: traffic
        name: nat-eip-${Rand.RFC1123Subdomain}
        shareType: PER
        size: 8
    publicip:
      - type: 5_bgp

---
apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: EIPV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/eipv1
  labels:
    testing.upbound.io/example-name: nat-eip-2
  name: nat-eip-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    bandwidth:
      - chargeMode: traffic
        name: nat-eip-${Rand.RFC1123Subdomain}
        shareType: PER
        size: 8
    publicip:
      - type: 5_bgp

---
apiVersion: nat.opentelekomcloud.m.crossplane.io/v1alpha1
kind: DnatRuleV2
metadata:
  annotations:
    meta.upbound.io/example-id: nat/v1alpha1/dnatrulev2
  labels:
    testing.upbound.io/example-name: nat-dnat
  name: nat-dnat-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    externalServicePort: 80
    internalServicePort: 80
    floatingIpSelector:
      matchLabels:
        testing.upbound.io/example-name: nat-eip-1
    natGatewaySelector:
      matchLabels:
        testing.upbound.io/example-name: nat-gateway
    protocol: tcp
    privateIp: "192.168.100.10"

---
apiVersion: nat.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SnatRuleV2
metadata:
  annotations:
    meta.upbound.io/example-id: nat/v1alpha1/snatrulev2
  labels:
    testing.upbound.io/example-name: nat-snat
  name: nat-snat-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: 192.168.0.0/24
    floatingIpSelector:
      matchLabels:
        testing.upbound.io/example-name: nat-eip-2
    natGatewaySelector:
      matchLabels:
        testing.upbound.io/example-name: nat-gateway
    sourceType: 0
