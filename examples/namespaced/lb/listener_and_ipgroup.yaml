apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/v1
  labels:
    testing.upbound.io/example-name: sample-lb
  name: lb-vpc-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: "192.168.0.0/16"
    name: lb-vpc-${Rand.RFC1123Subdomain}
    tags:
      managed-by: crossplane
---
apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SubnetV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/subnetv1
  labels:
    testing.upbound.io/example-name: sample-lb
  name: lb-stn-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: "192.168.0.0/16"
    gatewayIp: "192.168.0.1"
    name: lb-stn-${Rand.RFC1123Subdomain}
    ntpAddresses: "10.100.0.33,10.100.0.34"
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: sample-lb
    tags:
      managed-by: crossplane

---
apiVersion: lb.opentelekomcloud.m.crossplane.io/v1alpha1
kind: LoadbalancerV3
metadata:
  annotations:
    meta.upbound.io/example-id: lb/v1alpha1/loadbalancerv3
  labels:
    testing.upbound.io/example-name: sample-lb
  name: lb-lb-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    name: lb-lb-${Rand.RFC1123Subdomain}
    ipTargetEnable: true
    availabilityZones:
      - eu-de-01
    networkRef:
      - name: sample-lb
    routerSelector:
      matchLabels:
        testing.upbound.io/example-name: sample-lb
    tags:
      managed-by: crossplane

---
apiVersion: lb.opentelekomcloud.m.crossplane.io/v1alpha1
kind: IpgroupV3
metadata:
  annotations:
    meta.upbound.io/example-id: lb/v1alpha1/ipgroupv3
  labels:
    testing.upbound.io/example-name: sample-lb
  name: lb-ipg-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    description: crossplane group
    ipList:
      - description: first
        ip: "192.168.10.11"
    name: lb-ipg-${Rand.RFC1123Subdomain}

---
apiVersion: lb.opentelekomcloud.m.crossplane.io/v1alpha1
kind: ListenerV3
metadata:
  annotations:
    meta.upbound.io/example-id: lb/v1alpha1/listenerv3
  labels:
    testing.upbound.io/example-name: sample-lb
  name: lb-lis-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    name: lb-lis-${Rand.RFC1123Subdomain}
    loadbalancerSelector:
      matchLabels:
        testing.upbound.io/example-name: sample-lb
    protocol: HTTP
    protocolPort: 8080
    ipGroup:
      - idSelector:
          matchLabels:
            testing.upbound.io/example-name: sample-lb
    tags:
      managed-by: crossplane