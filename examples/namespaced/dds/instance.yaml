apiVersion: v1
kind: Secret
metadata:
  name: example-dds-password
  namespace: test
type: Opaque
data:
  example-dds-key: ${data.ddsKey}

---
apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: VpcV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/v1
  labels:
    testing.upbound.io/example-name: sample-dds-instance
  name: dds-vpc-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: "192.168.0.0/16"
    name: dds-vpc-${Rand.RFC1123Subdomain}
    tags:
      managed-by: crossplane
---
apiVersion: vpc.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SubnetV1
metadata:
  annotations:
    meta.upbound.io/example-id: vpc/v1alpha1/subnetv1
  labels:
    testing.upbound.io/example-name: sample-dds-instance
  name: dds-stn-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    cidr: "192.168.0.0/16"
    gatewayIp: "192.168.0.1"
    name: dds-stn-${Rand.RFC1123Subdomain}
    ntpAddresses: "10.100.0.33,10.100.0.34"
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: sample-dds-instance
    tags:
      managed-by: crossplane

---
apiVersion: compute.opentelekomcloud.m.crossplane.io/v1alpha1
kind: SecgroupV2
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1alpha1/secgroupv2
  labels:
    testing.upbound.io/example-name: sample-dds-instance
  name: dds-sg-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    description: crossplane security group
    name: dds-sg-${Rand.RFC1123Subdomain}
    rule:
      - cidr: 0.0.0.0/0
        fromPort: 22
        ipProtocol: tcp
        toPort: 22
      - cidr: 0.0.0.0/0
        fromPort: 8080
        ipProtocol: tcp
        toPort: 8080
      - cidr: 0.0.0.0/0
        fromPort: 27017
        ipProtocol: tcp
        toPort: 27017

---
apiVersion: dds.opentelekomcloud.m.crossplane.io/v1alpha1
kind: InstanceV3
metadata:
  annotations:
    meta.upbound.io/example-id: dds/v1alpha1/instancev3
  labels:
    testing.upbound.io/example-name: sample-dds-instance
  name: dds-ins-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    availabilityZone: eu-de-01
    datastore:
      - storageEngine: wiredTiger
        type: DDS-Community
        version: "4.0"
    flavor:
      - num: 1
        size: 30
        specCode: dds.mongodb.s2.medium.4.repset
        storage: ULTRAHIGH
        type: replica
    mode: ReplicaSet
    name: dds-ins-${Rand.RFC1123Subdomain}
    passwordSecretRef:
      key: example-dds-key
      name: example-dds-password
    subnetSelector:
      matchLabels:
        testing.upbound.io/example-name: sample-dds-instance
    vpcSelector:
      matchLabels:
        testing.upbound.io/example-name: sample-dds-instance
    securityGroupSelector:
      matchLabels:
        testing.upbound.io/example-name: sample-dds-instance
    tags:
      managed-by: crossplane

---
apiVersion: dds.opentelekomcloud.m.crossplane.io/v1alpha1
kind: BackupV3
metadata:
  annotations:
    meta.upbound.io/example-id: dds/v1alpha1/backupv3
  labels:
    testing.upbound.io/example-name: sample-dds-backup
  name: dds-bkp-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    instanceSelector:
      matchLabels:
        testing.upbound.io/example-name: sample-dds-instance
    name: dds-bkp-${Rand.RFC1123Subdomain}