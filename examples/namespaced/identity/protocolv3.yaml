apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: ProtocolV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/protocolv3
  labels:
    testing.upbound.io/example-name: saml
  name: saml
  namespace: test
spec:
  forProvider:
    mappingSelector:
      matchLabels:
        testing.upbound.io/example-name: mapping
    protocol: saml
    providerSelector:
      matchLabels:
        testing.upbound.io/example-name: provider

---
apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: MappingV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/protocolv3
  labels:
    testing.upbound.io/example-name: mapping
  name: mapping
  namespace: test
spec:
  forProvider:
    mappingId: ACME
    rules: |2
        [
          {
            "local":[
              {
                "user":{"name":"{0}"}
              },
              {
                "groups":"[\"admin\",\"manager\"]"
              }
            ],
            "remote":[
              {
                "type":"uid"
              }
            ]
          }
        ]
---
apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: ProviderV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/protocolv3
  labels:
    testing.upbound.io/example-name: provider
  name: iam-idp-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    description: This is simple identity provider
    enabled: true
    name: iam-idp-${Rand.RFC1123Subdomain}