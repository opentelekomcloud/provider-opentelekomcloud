apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: UserGroupMembershipV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/usergroupmembershipv3
  labels:
    testing.upbound.io/example-name: identity-usergroup-membership
  name: iam-ugm-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    groupsSelector:
      matchLabels:
        testing.upbound.io/example-name: identity-usergroup-group
    userSelector:
      matchLabels:
        testing.upbound.io/example-name: identity-usergroup-user

---
apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: GroupV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/usergroupmembershipv3
  labels:
    testing.upbound.io/example-name: identity-usergroup-group
  name: iam-grp-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    name: iam-grp-${Rand.RFC1123Subdomain}

---
apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: GroupV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/usergroupmembershipv3
  labels:
    testing.upbound.io/example-name: identity-usergroup-group
  name: iam-grp-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    name: iam-grp-${Rand.RFC1123Subdomain}

---
apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: UserV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/usergroupmembershipv3
  labels:
    testing.upbound.io/example-name: identity-usergroup-user
  name: iam-usr-${Rand.RFC1123Subdomain}
  namespace: test
spec:
  forProvider:
    enabled: true
    name: iam-usr-${Rand.RFC1123Subdomain}
    passwordSecretRef:
      key: example-key
      name: example-secret

---
apiVersion: v1
kind: Secret
metadata:
  name: example-secret
  namespace: test
type: Opaque
data:
  example-key: ${data.userKey}
