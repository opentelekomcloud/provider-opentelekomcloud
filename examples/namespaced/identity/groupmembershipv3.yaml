apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: GroupMembershipV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/groupmembershipv3
  labels:
    testing.upbound.io/example-name: membership_1
  name: membership-1
  namespace: test
spec:
  forProvider:
    groupSelector:
      matchLabels:
        testing.upbound.io/example-name: group_1
    usersSelector:
      matchLabels:
        testing.upbound.io/example-name: user_group_1

---
apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: GroupV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/groupmembershipv3
  labels:
    testing.upbound.io/example-name: group_1
  name: group-1
  namespace: test
spec:
  forProvider:
    description: crossplane
    name: xp-test-${Rand.RFC1123Subdomain}

---
apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: UserV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/groupmembershipv3
  labels:
    testing.upbound.io/example-name: user_group_1
  name: user-1
  namespace: test
spec:
  forProvider:
    enabled: true
    name: xp-test-${Rand.RFC1123Subdomain}
    passwordSecretRef:
      key: example-key
      name: example-secret

---
apiVersion: identity.opentelekomcloud.m.crossplane.io/v1alpha1
kind: UserV3
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha1/groupmembershipv3
  labels:
    testing.upbound.io/example-name: user_group_1
  name: user-2
  namespace: test
spec:
  forProvider:
    enabled: true
    name: xp-test-${Rand.RFC1123Subdomain}
    passwordSecretRef:
      key: example-key
      name: example-secret

---
apiVersion: v1
kind: Secret
metadata:
  name: example-secret
  namespace: test
type: Opaque
data:
  example-key: ${data.userKey}
