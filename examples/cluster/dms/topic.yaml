apiVersion: dms.opentelekomcloud.crossplane.io/v1alpha1
kind: TopicV2
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/topicv2
  labels:
    testing.upbound.io/example-name: dms-topic
  name: dms-topic
spec:
  forProvider:
    name: crossplane-topic
    partition: 3
    # Single-broker instance: the replication factor cannot exceed the broker count.
    replication: 1
    retentionTime: 72
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-instance
