# Not part of e2e: reassignment needs a cluster instance with at least 3 brokers.
# Uses the cluster instance and topic defined in smart-connect.yaml.
apiVersion: dms.opentelekomcloud.crossplane.io/v1alpha1
kind: ReassignPartitionsV2
metadata:
  annotations:
    meta.upbound.io/example-id: dms/v1alpha1/reassignpartitionsv2
    upjet.upbound.io/manual-intervention: "Requires a 3-broker cluster instance that is not part of e2e."
  labels:
    testing.upbound.io/example-name: dms-reassign-partitions
  name: dms-reassign-partitions
spec:
  forProvider:
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: dms-cluster-instance
    reassignments:
      - brokers:
          - 0
          - 1
          - 2
        replicationFactor: 3
        topicSelector:
          matchLabels:
            testing.upbound.io/example-name: dms-cluster-topic
    throttle: 1000000
    timeEstimate: false
